name: Release on Tag

on:
  push:
    tags:
      - 'v*'
      - 'release-*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 🔨 Build mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: 📝 Get tag version
        id: tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Release Tag: $TAG_VERSION"

      - name: 📝 Get changelog
        id: changelog
        run: |
          if [ -f "CHANGELOG.md" ]; then
            cat CHANGELOG.md > release_notes.md
          else
            echo "## Release ${{ steps.tag.outputs.tag_version }}" > release_notes.md
            echo "" >> release_notes.md
            echo "### Changes" >> release_notes.md
            echo "- See commits for details" >> release_notes.md
          fi

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/separatebobbers-*.jar
          body_path: release_notes.md
          draft: false
          prerelease: false
          name: "Release ${{ steps.tag.outputs.tag_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload to releases
        run: |
          echo "✅ Release created successfully!"
          echo "JAR file: separatebobbers-${{ steps.tag.outputs.tag_version }}.jar"
