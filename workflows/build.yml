name: Build Separate Bobbers Mod

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 🔨 Build mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: separatebobbers-build
          path: build/libs/separatebobbers-*.jar
          retention-days: 30

      - name: 📝 Get version from gradle.properties
        id: version
        run: |
          VERSION=$(grep 'mod_version=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: 🏷️ Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/separatebobbers-*.jar
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📄 Publish to GitHub Pages (docs)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./README.md
          cname: bobber.example.com
        continue-on-error: true
